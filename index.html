<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./style.css">
    <script defer type="module" src="./script.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body x-data="countries">
    <main x-show="!loading">
        <img class="img-flag"
            x-show="country_flag_src"
            :src="country_flag_src"
            :alt="country_flag_alt" />

        <div class="group">
            <input class="inp-group" type="text"
                id="inp-country" autofocus
                x-model="term" list="datalist-countries"
                @keyup.enter="get_random_country"
                @input="filter_countries"
            />

            <ul id="datalist-countries" x-show="filtered_countries.length > 0">
                <template x-for="(country, idx) in filtered_countries" :key="idx">
                    <li x-text="country.name_por"></li>
                </template>
            </ul>

            <button class="inp-group"
                @click="get_random_country">Continuar</button>
        </div>

        <!-- <p>Tentativas: <span x-text="tries + 1"></span></p> -->
    </main>

    <p class="loading" x-show="loading">Loading ...</p>
</body>
</html>
